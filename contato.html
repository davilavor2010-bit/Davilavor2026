<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Sonho - Itália</title>
    <link rel="icon" type="image/jpg" href="img/bandeira.jpg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu Sonho de Viajar para a Itália</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="atualmente.html">Atualmente</a>
            <a href="futuro.html">Futuro</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <section class="formulario">
            <h2>Entre em contato</h2>

            <form id="formContato">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">

                <label for="avaliacao">Sua avaliação:</label>
                <select id="avaliacao">
                    <option value="">Selecione uma nota</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <label for="comentario">Comentário:</label>
                <textarea id="comentario" placeholder="Deixe aqui seu comentário."></textarea>

                <button type="submit">Enviar</button>

            </form>

            <p id="mensagem"></p>

        </section>

    </main>

    <footer>
          <h5 align="center">Davi Candido Belchior Lavor 2026-&copyTodos os direitos reservados<br>
		Trabalho acadêmico sem fins lucrativos.</h5>
    </footer>

    <script>
        const formulario = document.getElementById("formContato");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const avaliacao = document.getElementById("avaliacao").value;
            const comentario = document.getElementById("comentario").value;

            if (nome === "" || email === "" || avaliacao === "" || comentario === "") {
                mensagem.textContent = "Por favor, preencha todos os campos.";
                mensagem.className = "erro";
                return;
            }

            mensagem.textContent = "Obrigado pela sua avaliação, " + nome + "! 🇮🇹";
            mensagem.className = "sucesso";

            formulario.reset();
        });
    </script>

</body>
</html>
